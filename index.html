<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학교 사람 탐험대 (토끼버전)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        *,*::before,*::after{box-sizing:border-box;}
        html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
        body{font-family:'Jua',sans-serif;background:#f0fdf4;touch-action:manipulation;}
        #root{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

        /* vmin 기반 다이나믹 컴포넌트 */
        .v-screen{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vmin;overflow:hidden;position:relative;}
        .v-card{background:white;border-radius:3vmin;padding:4vmin;width:100%;max-width:80vmin;box-shadow:0 4px 40px rgba(0,0,0,0.12);border:0.5vmin solid #d1fae5;}
        .v-h1{font-size:5.5vmin;font-weight:900;line-height:1.2;}
        .v-h2{font-size:4.5vmin;font-weight:800;line-height:1.2;}
        .v-h3{font-size:3.5vmin;font-weight:700;line-height:1.3;}
        .v-body{font-size:2.8vmin;line-height:1.5;}
        .v-btn{width:100%;padding:2.5vmin 4vmin;font-size:4vmin;font-weight:700;border-radius:2vmin;border:none;cursor:pointer;transition:transform 0.1s,opacity 0.2s;font-family:'Jua',sans-serif;}
        .v-btn:active{transform:scale(0.97);}
        .v-btn-green{background:#22c55e;color:white;}
        .v-btn-green:hover{background:#16a34a;}
        .v-btn-yellow{background:#facc15;color:white;}
        .v-btn-yellow:hover{background:#eab308;}
        .v-btn-gray{background:#f3f4f6;color:#6b7280;}
        .v-select{width:100%;padding:2vmin;font-size:3.5vmin;font-weight:700;border:0.4vmin solid #bbf7d0;border-radius:1.5vmin;background:#f0fdf4;color:#15803d;font-family:'Jua',sans-serif;outline:none;margin-bottom:2vmin;}
        .v-select:focus{border-color:#22c55e;}
        .v-mic{width:16vmin;height:16vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;border:0.6vmin solid;font-size:6vmin;cursor:pointer;transition:transform 0.1s;margin:0 auto;}
        .v-mic:active{transform:scale(0.95);}
        .v-top-bar{position:absolute;top:2vmin;right:2vmin;z-index:50;}
        .v-top-btn{padding:1.5vmin;border-radius:50%;border:none;cursor:pointer;font-size:3.5vmin;line-height:1;}
        .v-progress{height:1.5vmin;border-radius:99px;background:#e5e7eb;overflow:hidden;width:100%;}
        .v-progress-fill{height:100%;background:#22c55e;transition:width 0.4s ease;}
        .v-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vmin;width:100%;}
        .v-place-btn{padding:2.5vmin;border-radius:2vmin;border:0.4vmin solid #bbf7d0;background:white;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1vmin;font-family:'Jua',sans-serif;font-size:2.5vmin;font-weight:700;transition:all 0.15s;}
        .v-place-btn:active{transform:scale(0.95);}
        .v-place-btn.done{background:#f9fafb;border-color:#e5e7eb;color:#9ca3af;}
        .v-place-emoji{font-size:5vmin;}
        .v-bottom-sheet{position:absolute;bottom:0;left:0;right:0;background:white;border-radius:3vmin 3vmin 0 0;padding:4vmin;box-shadow:0 -4px 30px rgba(0,0,0,0.15);border-top:0.5vmin solid #d1fae5;}
        .v-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:4vmin;}
        .v-popup{background:white;border-radius:3vmin;padding:5vmin;width:100%;max-width:70vmin;text-align:center;}
        .v-star{font-size:7vmin;cursor:pointer;transition:transform 0.1s;}
        .v-star:active{transform:scale(0.9);}
        .v-txt-area{width:100%;height:10vmin;padding:2vmin;border:0.4vmin dashed #d1d5db;border-radius:1.5vmin;background:#f9fafb;font-size:2.5vmin;font-family:'Jua',sans-serif;resize:none;overflow-y:auto;}

        @keyframes rabbitBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5vmin)}}
        @keyframes fadeInScale{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
        @keyframes slideUp{from{opacity:0;transform:translateY(3vmin)}to{opacity:1;transform:translateY(0)}}
        @keyframes spinAnim{to{transform:rotate(360deg)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        @keyframes slideInBottom{from{transform:translateY(100%)}to{transform:translateY(0)}}
        @keyframes popIn{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}
        .rabbit-bounce{animation:rabbitBounce 2s ease-in-out infinite;}
        .fade-in-scale{animation:fadeInScale 0.3s ease-out;}
        .slide-up{animation:slideUp 0.3s ease-out;}
        .spin{animation:spinAnim 1s linear infinite;}
        .pulse-record{animation:pulse 0.9s ease-in-out infinite;}
        .slide-in-bottom{animation:slideInBottom 0.3s ease-out;}
        .pop-in{animation:popIn 0.25s ease-out;}
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 인라인 SVG 아이콘 ---
        const svgBase = (d, extra='') => (size, cls) =>
            `<svg width="${size}" height="${size}" class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
        const ICONS = {
            'mic': svgBase('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>'),
            'volume-2': svgBase('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>'),
            'volume-x': svgBase('<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/>'),
            'loader-2': svgBase('<path d="M21 12a9 9 0 1 1-6.219-8.56"/>'),
            'check-circle': svgBase('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'),
            'star': svgBase('<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'),
            'award': svgBase('<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>'),
        };
        const Icon = ({ name, size=24, className='' }) => {
            const fn = ICONS[name];
            if (!fn) return null;
            return <span dangerouslySetInnerHTML={{ __html: fn(size, className) }} style={{display:'inline-flex',alignItems:'center'}}/>;
        };

        // --- 토끼 캐릭터 (SVG) ---
        const RabbitCharacter = ({ className = "" }) => (
            <div className={`relative inline-block rabbit-bounce ${className}`}>
                <svg width="100" height="120" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 50C35 50 15 10 30 10C45 10 50 40 50 40" fill="#FFFFFF" stroke="#4B5563" strokeWidth="3" strokeLinecap="round" />
                    <path d="M33 45C33 45 22 18 31 18C39 18 45 35 45 35" fill="#FBCFE8" />
                    <path d="M65 50C65 50 85 10 70 10C55 10 50 40 50 40" fill="#FFFFFF" stroke="#4B5563" strokeWidth="3" strokeLinecap="round" />
                    <path d="M67 45C67 45 78 18 69 18C61 18 55 35 55 35" fill="#FBCFE8" />
                    <circle cx="50" cy="70" r="35" fill="#FFFFFF" stroke="#4B5563" strokeWidth="3" />
                    <circle cx="38" cy="65" r="4" fill="#1F2937" />
                    <circle cx="62" cy="65" r="4" fill="#1F2937" />
                    <circle cx="39" cy="64" r="1.5" fill="#FFFFFF" />
                    <circle cx="63" cy="64" r="1.5" fill="#FFFFFF" />
                    <ellipse cx="30" cy="72" rx="5" ry="3" fill="#FBCFE8" opacity="0.8" />
                    <ellipse cx="70" cy="72" rx="5" ry="3" fill="#FBCFE8" opacity="0.8" />
                    <path d="M48 72C48 72 50 74 52 72" stroke="#4B5563" strokeWidth="2" strokeLinecap="round" />
                    <path d="M50 73V76C50 76 46 80 50 80C54 80 50 76 50 76" stroke="#4B5563" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                </svg>
            </div>
        );


        // --- 사운드 관리 ---
        const playSound = (type, isMuted) => {
            if (isMuted) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            }
        };

        const App = () => {
            // 아래에 선생님의 구글 앱스 스크립트 웹 앱 URL을 붙여넣으세요!
            const GAS_URL = "https://script.google.com/macros/s/AKfycbwEqZ2wN23-lg4eQ-Ckt4ouGFD7DGMGksrYMCwYf6ntWabQrUH3bj-Wqn7mmvw9PbzZ/exec";

            const [gasUrl] = useState(GAS_URL);
            const [isMuted, setIsMuted] = useState(true);
            const [micAllowed, setMicAllowed] = useState(false);
            const [phase, setPhase] = useState('loading'); // loading, error, perm, login, intro, prerecord, dictionary, explore, etiquette, postrecord, eval, reward
            const [students, setStudents] = useState([]);
            const [places, setPlaces] = useState([]);
            const [etiquette, setEtiquette] = useState([]);

            const [studentName, setStudentName] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [loadingMsg, setLoadingMsg] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            // 로깅 및 데이터 저장용 상태
            const [preAudioText, setPreAudioText] = useState('');
            const [preAudioBase64, setPreAudioBase64] = useState('');
            const [preAudioMimeType, setPreAudioMimeType] = useState('');

            const [postAudioText, setPostAudioText] = useState('');
            const [postAudioBase64, setPostAudioBase64] = useState('');
            const [postAudioMimeType, setPostAudioMimeType] = useState('');

            const [wrongPlaces, setWrongPlaces] = useState([]);
            const [wrongEtiquette, setWrongEtiquette] = useState([]);
            const [stars, setStars] = useState(0);

            // 단계별 인덱스
            const [currentPlaceIdx, setCurrentPlaceIdx] = useState(0);
            const [exploredPlaces, setExploredPlaces] = useState([]);
            const [currentEtiquetteIdx, setCurrentEtiquetteIdx] = useState(0);

            const [feedback, setFeedback] = useState(null);

            // 음성 인식 관련
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recognitionRef = useRef(null);

            // 음성 출력
            const speak = (text) => {
                if (isMuted || !window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const utterThis = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const googleVoice = voices.find(v => v.name.includes('Google') && v.lang === 'ko-KR');
                if (googleVoice) {
                    utterThis.voice = googleVoice;
                }
                utterThis.rate = 0.9;
                utterThis.pitch = 1.1;
                utterThis.lang = 'ko-KR';
                window.speechSynthesis.speak(utterThis);
            };

            // 데이터 불러오기
            const fetchData = async (url) => {
                setIsLoading(true); setLoadingMsg("학교 데이터를 불러오고 있어요..."); setErrorMsg('');
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.success) {
                        setStudents(data.students || []);
                        setPlaces(data.places || []);
                        setEtiquette(data.etiquette || []);
                        setPhase('perm'); // 데이터 로드 후 마이크 권한 요청
                    } else {
                        setErrorMsg("데이터를 불러오는데 실패했어요. URL을 확인해주세요.");
                        setPhase('error');
                    }
                } catch (e) {
                    setErrorMsg("네트워크 오류가 발생했어요. 앱스 스크립트 URL이 맞는지 확인해주세요.");
                    setPhase('error');
                }
                setIsLoading(false);
            };

            // 처음에 자동으로 데이터 불러오기
            useEffect(() => {
                if (GAS_URL && GAS_URL !== "여기에_배포한_앱스스크립트_URL을_붙여넣으세요") {
                    fetchData(GAS_URL);
                } else {
                    setErrorMsg("index.html 파일 코드 상단의 GAS_URL 변수에 주소를 입력해주세요!");
                    setPhase('error');
                }
            }, []);

            // 마이크 권한 요청
            const requestMicPermission = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(t => t.stop()); // 권한만 얻고 바로 해제
                    setMicAllowed(true);
                    setPhase('login');
                } catch (e) {
                    setMicAllowed(false);
                    setPhase('login'); // 거부해도 진행(녹음 기능만 비활성화)
                }
            };

            // 녹음 시작
            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const options = { mimeType: 'audio/webm' };
                    const recorder = new MediaRecorder(stream, options);
                    mediaRecorderRef.current = recorder;
                    audioChunksRef.current = [];

                    recorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    recorder.onstop = () => {
                        const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = () => {
                            const base64data = reader.result.split(',')[1];
                            if (phase === 'prerecord') {
                                setPreAudioBase64(base64data);
                                setPreAudioMimeType('audio/webm');
                            } else if (phase === 'postrecord') {
                                setPostAudioBase64(base64data);
                                setPostAudioMimeType('audio/webm');
                            }
                        };
                    };

                    // 음성 인식 시작 (STT)
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        const recognition = new SpeechRecognition();
                        recognition.lang = 'ko-KR';
                        recognition.continuous = true;
                        recognition.interimResults = true;

                        let finalTranscript = '';
                        recognition.onresult = (e) => {
                            let interimTranscript = '';
                            for (let i = e.resultIndex; i < e.results.length; ++i) {
                                if (e.results[i].isFinal) {
                                    finalTranscript += e.results[i][0].transcript + ' ';
                                } else {
                                    interimTranscript += e.results[i][0].transcript;
                                }
                            }
                            if (phase === 'prerecord') {
                                setPreAudioText(finalTranscript + interimTranscript);
                            } else if (phase === 'postrecord') {
                                setPostAudioText(finalTranscript + interimTranscript);
                            }
                        };
                        recognitionRef.current = recognition;
                        recognition.start();
                    }

                    recorder.start();
                    setIsRecording(true);
                } catch (err) {
                    alert("마이크 사용 권한이 필요해요!");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                }
                if (recognitionRef.current) {
                    recognitionRef.current.stop();
                }
                setIsRecording(false);
            };

            // 결과 제출
            const submitResults = async (finalStars) => {
                setIsLoading(true); setLoadingMsg("학습 결과를 저장하고 있어요...");
                try {
                    const payload = {
                        action: "saveResult",
                        studentName,
                        preAudioBase64, preAudioMimeType, preAudioText,
                        postAudioBase64, postAudioMimeType, postAudioText,
                        stars: finalStars,
                        wrongPlaces,
                        wrongEtiquette
                    };

                    await fetch(gasUrl, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    setPhase('reward');
                } catch (e) {
                    alert("결과 저장 중 오류가 발생했습니다.");
                    setPhase('reward');
                }
                setIsLoading(false);
            };

            const handleStarClick = (s) => {
                setStars(s);
                if (s <= 3) {
                    // 3점 이하면 재도전 버튼을 보여줌 (상태 변경 없이 eval 화면 유지)
                } else {
                    submitResults(s);
                }
            };

            // TopBar
            const TopBar = () => (
                <div className="v-top-bar">
                    <button onClick={() => setIsMuted(!isMuted)} className={`v-top-btn ${isMuted ? 'bg-gray-100' : 'bg-green-100'}`}>
                        {isMuted ? '🔇' : '🔊'}
                    </button>
                </div>
            );

            // 1. Loading
            if (phase === 'loading') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center'}}>
                    <RabbitCharacter />
                    <div className="spin" style={{fontSize:'5vmin',marginTop:'2vmin'}}>⏳</div>
                    <p className="v-h2" style={{color:'#15803d',marginTop:'2vmin'}}>{loadingMsg || '앱을 준비하는 중...'}</p>
                </div>
            );

            // Error
            if (phase === 'error') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center'}}>
                    <RabbitCharacter />
                    <p className="v-h2" style={{color:'#ef4444',marginTop:'2vmin'}}>앗, 설정이 필요해요!</p>
                    <p className="v-body" style={{color:'#6b7280',marginTop:'1vmin',maxWidth:'70vmin'}}>{errorMsg}</p>
                </div>
            );

            // Mic Permission
            if (phase === 'perm') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'3vmin'}}>
                    <RabbitCharacter />
                    <div className="v-card" style={{textAlign:'center'}}>
                        <div style={{fontSize:'8vmin'}}>🎤</div>
                        <p className="v-h2" style={{color:'#15803d',margin:'2vmin 0 1vmin'}}>마이크 사용 필요해요!</p>
                        <p className="v-body" style={{color:'#6b7280',marginBottom:'3vmin'}}>이 앱은 학습 전후 말하기를 녹음해요.<br/>마이크 사용을 허락해 주세요.</p>
                        <button className="v-btn v-btn-green" onClick={requestMicPermission}>🐇 한번 시작하기!</button>
                    </div>
                </div>
            );

            // Login
            if (phase === 'login') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <RabbitCharacter />
                    <p className="v-h1" style={{color:'#15803d'}}>학교 사람 탐험대</p>
                    <p className="v-body" style={{color:'#6b7280'}}>내 이름을 선택하고 시작하세요!</p>
                    <div className="v-card">
                        <select className="v-select" value={studentName} onChange={(e) => setStudentName(e.target.value)}>
                            <option value="">이름을 선택하세요 ▼</option>
                            {students.map((s, i) => <option key={i} value={s}>{s}</option>)}
                        </select>
                        <button className="v-btn v-btn-green" style={{opacity: studentName ? 1 : 0.4}}
                            onClick={() => { if (studentName) setPhase('intro'); }}>
                            시작하기 🐇
                        </button>
                    </div>
                </div>
            );

            // Intro
            if (phase === 'intro') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <RabbitCharacter />
                    <div className="v-card fade-in-scale" style={{textAlign:'center'}}>
                        <p className="v-h2" style={{color:'#16a34a',marginBottom:'1.5vmin'}}>안녕, {studentName}! 👋</p>
                        <p className="v-body" style={{color:'#374151',marginBottom:'3vmin'}}>
                            우리 학교에는 어떤 사람들이 있을까요?<br/>미리 아는 대로 말해보아요!
                        </p>
                        <button className="v-btn v-btn-green"
                            onClick={() => { speak('우리 학교에 어떤 사람들이 있는지 아는 대로 말해보세요.'); setPhase('prerecord'); }}>
                            사전 녹음하러 가기 🎤
                        </button>
                    </div>
                </div>
            );

            // Pre-Record
            if (phase === 'prerecord') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <div className="v-card" style={{textAlign:'center'}}>
                        <p className="v-h2" style={{color:'#15803d',marginBottom:'1vmin'}}>학교에는 누가 있을까요?</p>
                        <p className="v-body" style={{color:'#9ca3af',marginBottom:'2vmin'}}>마이크 버튼을 눌러 말해보세요.</p>
                        <button className={`v-mic ${isRecording ? 'pulse-record' : ''}`}
                            style={{background: isRecording ? '#fee2e2' : '#dcfce7', borderColor: isRecording ? '#ef4444' : '#22c55e', color: isRecording ? '#ef4444' : '#22c55e'}}
                            onClick={isRecording ? null : startRecording} disabled={isRecording}>
                            🎤
                        </button>
                        <p className="v-body" style={{color: isRecording ? '#ef4444' : '#9ca3af', marginTop:'1.5vmin'}}>
                            {isRecording ? '🔴 녹음 중... (종료 버튼을 눌러주세요)' : '버튼을 눌러 시작'}
                        </p>
                        <div className="v-txt-area" style={{marginTop:'2vmin',textAlign:'left'}}>
                            {preAudioText || <span style={{color:'#d1d5db'}}>말한 내용이 여기에 나타납니다...</span>}
                        </div>
                        {isRecording ? (
                            <button className="v-btn" style={{marginTop:'2vmin', background:'#ef4444', color:'white'}}
                                onClick={() => { stopRecording(); setPhase('dictionary'); }}>
                                🛑 녹음 종료 및 출발하기 →
                            </button>
                        ) : (
                            <button className="v-btn v-btn-green" style={{marginTop:'2vmin', opacity: preAudioText ? 1 : 0.4}}
                                disabled={!preAudioText} onClick={() => setPhase('dictionary')}>
                                탐험 시작하기 →
                            </button>
                        )}
                    </div>
                </div>
            );

            // Dictionary
            if (phase === 'dictionary') return (
                <div className="v-screen" style={{background:'#fffbeb',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <div className="v-card slide-up" style={{textAlign:'center', borderColor:'#fde68a'}}>
                        <div style={{fontSize:'7vmin'}}>📖</div>
                        <p className="v-h2" style={{color:'#d97706',margin:'1vmin 0'}}>학교 사람 사전</p>
                        <p className="v-body" style={{color:'#374151',marginBottom:'3vmin'}}>
                            우리 학교에는 다양한 역할을 해주시는<br/>고마운 분들이 많이 계셔요!<br/>직접 장소를 돌아다니며 알아볼까요?
                        </p>
                        <button className="v-btn v-btn-yellow" onClick={() => setPhase('explore')}>출발하기 🚀</button>
                    </div>
                </div>
            );

            // 6. Explore Places
            if (phase === 'explore') {
                const currentPlace = places[currentPlaceIdx];
                const allDone = exploredPlaces.length >= places.length;

                const handlePlaceAnswer = (optionIndex) => {
                    const isCorrect = (optionIndex + 1).toString() === currentPlace['정답(1또는2)'].toString();
                    if (isCorrect) {
                        playSound('correct', isMuted);
                        setFeedback({ type: 'success', text: currentPlace['정답피드백'] });
                        speak(currentPlace['정답피드백']);
                        if (!exploredPlaces.includes(currentPlaceIdx)) {
                            setExploredPlaces([...exploredPlaces, currentPlaceIdx]);
                        }

                        // 3초 후 자동 전환
                        setTimeout(() => {
                            setFeedback(null);
                        }, 3000);

                    } else {
                        playSound('wrong', isMuted);
                        setFeedback({ type: 'error', text: currentPlace['오답피드백'] });
                        speak(currentPlace['오답피드백']);
                        if (!wrongPlaces.includes(currentPlace['장소'])) {
                            setWrongPlaces([...wrongPlaces, currentPlace['장소']]);
                        }
                    }
                };

                return (
                    <div className="v-screen" style={{background:'#f0fdf4',justifyContent:'flex-start',paddingTop:'6vmin',position:'relative'}}>
                        <TopBar />
                        <p className="v-h2" style={{color:'#15803d',marginBottom:'2vmin'}}>어디로 가볼까요? 🗺️</p>
                        <div className="v-grid" style={{width:'100%',maxWidth:'90vmin'}}>
                            {places.map((p,i)=>(
                                <button key={i} className={`v-place-btn ${exploredPlaces.includes(i)?'done':''}`}
                                    onClick={()=>{setCurrentPlaceIdx(i);setFeedback(null);speak(p['질문']);}}>
                                    <span className="v-place-emoji">{p['이모지']}</span>
                                    <span>{exploredPlaces.includes(i)?'✅ ':''}{p['장소']}</span>
                                </button>
                            ))}
                        </div>
                        {allDone && (
                            <button className="v-btn v-btn-green fade-in-scale" style={{marginTop:'2vmin',maxWidth:'80vmin'}}
                                onClick={()=>setPhase('etiquette')}>다음 활동으로 →</button>
                        )}
                        {currentPlace && !feedback && !allDone && !exploredPlaces.includes(currentPlaceIdx) && (
                            <div className="v-overlay">
                                <div className="v-popup pop-in" style={{border:'0.4vmin solid #86efac', textAlign:'center'}}>
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'1.5vmin',marginBottom:'1.5vmin'}}>
                                        <span style={{fontSize:'6vmin'}}>{currentPlace['이모지']}</span>
                                        <p className="v-h3" style={{color:'#1f2937'}}>{currentPlace['장소']}</p>
                                    </div>
                                    <p className="v-body" style={{color:'#4b5563',marginBottom:'3vmin',fontWeight:700}}>{currentPlace['질문']}</p>
                                    <div style={{display:'flex',flexDirection:'column',gap:'1.5vmin'}}>
                                        <button className="v-btn v-btn-gray" style={{textAlign:'center'}} onClick={()=>handlePlaceAnswer(0)}>{currentPlace['선택지1']}</button>
                                        <button className="v-btn v-btn-gray" style={{textAlign:'center'}} onClick={()=>handlePlaceAnswer(1)}>{currentPlace['선택지2']}</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        {feedback && (
                            <div className="v-overlay">
                                <div className="v-popup pop-in" style={{border:`0.5vmin solid ${feedback.type==='success'?'#22c55e':'#ef4444'}`}}>
                                    <div style={{fontSize:'8vmin'}}>{feedback.type==='success'?'🎉':'🤔'}</div>
                                    <p className="v-h3" style={{color:feedback.type==='success'?'#16a34a':'#dc2626',margin:'1.5vmin 0'}}>{feedback.text}</p>
                                    {feedback.type==='success'
                                        ?<p className="v-body" style={{color:'#9ca3af'}}>잠시 후 자동으로 넘어갑니다...</p>
                                        :<button className="v-btn" style={{background:'#ef4444',color:'white',marginTop:'1.5vmin'}} onClick={()=>setFeedback(null)}>다시 풀기</button>}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // Etiquette
            if (phase === 'etiquette') {
                const currentQ = etiquette[currentEtiquetteIdx];
                if (!currentQ) return <div className="v-screen"/>;
                const handleEtiquetteAnswer = (idx) => {
                    const ok = (idx+1).toString() === currentQ['정답(1또는2)'].toString();
                    if (ok) {
                        playSound('correct',isMuted); speak(currentQ['정답피드백']);
                        setFeedback({type:'success',text:currentQ['정답피드백']});
                        setTimeout(()=>{
                            setFeedback(null);
                            if (currentEtiquetteIdx < etiquette.length-1) setCurrentEtiquetteIdx(currentEtiquetteIdx+1);
                            else setPhase('postrecord');
                        },3000);
                    } else {
                        playSound('wrong',isMuted); speak(currentQ['오답피드백']);
                        setFeedback({type:'error',text:currentQ['오답피드백']});
                        if (!wrongEtiquette.includes(currentQ['ID'])) setWrongEtiquette([...wrongEtiquette,currentQ['ID']]);
                    }
                };
                return (
                    <div className="v-screen" style={{background:'#f0fdf4',gap:'2vmin',position:'relative'}}>
                        <TopBar />
                        <div style={{width:'100%',maxWidth:'80vmin'}}>
                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'1vmin'}}>
                                <span className="v-body" style={{color:'#15803d',fontWeight:700}}>상황별 예절 퀴즈</span>
                                <span className="v-body" style={{color:'#9ca3af'}}>{currentEtiquetteIdx+1} / {etiquette.length}</span>
                            </div>
                            <div className="v-progress"><div className="v-progress-fill" style={{width:`${(currentEtiquetteIdx/etiquette.length)*100}%`}}/></div>
                        </div>
                        <div className="v-card">
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'2vmin'}}>
                                <p className="v-h3" style={{color:'#1f2937',flex:1,paddingRight:'2vmin'}}>{currentQ['시나리오']}</p>
                                <button onClick={()=>speak(currentQ['시나리오'])} style={{fontSize:'3.5vmin',background:'#f0fdf4',border:'none',borderRadius:'50%',padding:'1vmin',cursor:'pointer'}}>🔊</button>
                            </div>
                            <div style={{display:'flex',flexDirection:'column',gap:'1.5vmin'}}>
                                <button className="v-btn v-btn-gray" style={{textAlign:'left'}} onClick={()=>handleEtiquetteAnswer(0)}>{currentQ['선택지1']}</button>
                                <button className="v-btn v-btn-gray" style={{textAlign:'left'}} onClick={()=>handleEtiquetteAnswer(1)}>{currentQ['선택지2']}</button>
                            </div>
                        </div>
                        {feedback && (
                            <div className="v-overlay">
                                <div className="v-popup pop-in" style={{border:`0.5vmin solid ${feedback.type==='success'?'#22c55e':'#ef4444'}`}}>
                                    <div style={{fontSize:'8vmin'}}>{feedback.type==='success'?'✨':'😅'}</div>
                                    <p className="v-h3" style={{color:feedback.type==='success'?'#16a34a':'#dc2626',margin:'1.5vmin 0'}}>{feedback.text}</p>
                                    {feedback.type==='success'
                                        ?<p className="v-body" style={{color:'#9ca3af'}}>잠시 후 자동으로 넘어갑니다...</p>
                                        :<button className="v-btn" style={{background:'#ef4444',color:'white',marginTop:'1.5vmin'}} onClick={()=>setFeedback(null)}>다시 풀기</button>}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // Post-Record
            if (phase === 'postrecord') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <div className="v-card" style={{textAlign:'center'}}>
                        <p className="v-h2" style={{color:'#15803d',marginBottom:'1vmin'}}>학습을 마쳤어요! 🎊</p>
                        <p className="v-body" style={{color:'#9ca3af',marginBottom:'2vmin'}}>학교 사람들을 다시 한번 말해볼까요?</p>
                        <button className={`v-mic ${isRecording?'pulse-record':''}`}
                            style={{background:isRecording?'#fee2e2':'#dcfce7',borderColor:isRecording?'#ef4444':'#22c55e',color:isRecording?'#ef4444':'#22c55e'}}
                            onClick={isRecording ? null : startRecording} disabled={isRecording}>🎤</button>
                        <p className="v-body" style={{color:isRecording?'#ef4444':'#9ca3af',marginTop:'1.5vmin'}}>
                            {isRecording ? '🔴 녹음 중... (종료 버튼을 눌러주세요)' : '버튼을 눌러 시작'}
                        </p>
                        <div className="v-txt-area" style={{marginTop:'2vmin',textAlign:'left'}}>
                            {postAudioText||<span style={{color:'#d1d5db'}}>말한 내용이 여기에 나타납니다...</span>}
                        </div>
                        {isRecording ? (
                            <button className="v-btn" style={{marginTop:'2vmin', background:'#ef4444', color:'white'}}
                                onClick={() => { stopRecording(); setPhase('eval'); }}>
                                🛑 녹음 종료 및 평가하러 가기 →
                            </button>
                        ) : (
                            <button className="v-btn v-btn-green" style={{marginTop:'2vmin', opacity: postAudioText ? 1 : 0.4}}
                                disabled={!postAudioText} onClick={() => setPhase('eval')}>
                                평가하러 가기 →
                            </button>
                        )}
                    </div>
                </div>
            );

            // Eval
            if (phase === 'eval') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin',position:'relative'}}>
                    {isLoading && (
                        <div style={{position:'absolute',inset:0,background:'rgba(255,255,255,0.85)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:60}}>
                            <div className="spin" style={{fontSize:'5vmin'}}>⏳</div>
                            <p className="v-body" style={{color:'#15803d',marginTop:'1vmin'}}>{loadingMsg}</p>
                        </div>
                    )}
                    <TopBar />
                    <div className="v-card" style={{textAlign:'center'}}>
                        <p className="v-h2" style={{color:'#1f2937',marginBottom:'1vmin'}}>스스로 평가해 보아요 ⭐</p>
                        <p className="v-body" style={{color:'#9ca3af',marginBottom:'2vmin'}}>오늘 학습에 얼마나 열심히 참여했나요?</p>
                        <div style={{display:'flex',justifyContent:'center',gap:'1vmin',marginBottom:'2vmin'}}>
                            {[1,2,3,4,5].map(s=>(
                                <button key={s} className="v-star" onClick={()=>handleStarClick(s)}>
                                    {s<=stars?'⭐':'☆'}
                                </button>
                            ))}
                        </div>
                        {stars>0 && stars<=3 && (
                            <div className="slide-up" style={{background:'#fff7ed',border:'0.4vmin solid #fdba74',borderRadius:'2vmin',padding:'2vmin'}}>
                                <p className="v-body" style={{color:'#c2410c',fontWeight:700,marginBottom:'1.5vmin'}}>조금 더 알아보고 싶나요?</p>
                                <button className="v-btn" style={{background:'#f97316',color:'white',marginBottom:'1vmin'}}
                                    onClick={()=>{setStars(0);setCurrentPlaceIdx(0);setExploredPlaces([]);setCurrentEtiquetteIdx(0);setWrongPlaces([]);setWrongEtiquette([]);setPhase('explore');}}>
                                    다시 활동하기 🔄
                                </button>
                                <button className="v-btn v-btn-gray" onClick={()=>submitResults(stars)}>아니요, 마칠래요</button>
                            </div>
                        )}
                        {stars>3 && <p className="v-body" style={{color:'#16a34a',fontWeight:700}}>정말 훌륭해요! 잠시 기다려주세요... ✨</p>}
                    </div>
                </div>
            );

            // Reward
            if (phase === 'reward') return (
                <div className="v-screen" style={{background:'#f0fdf4',textAlign:'center',gap:'2vmin'}}>
                    <TopBar />
                    <div className="v-card fade-in-scale" style={{textAlign:'center',border:'0.5vmin double #86efac'}}>
                        <div style={{fontSize:'9vmin'}}>🏆</div>
                        <p className="v-h1" style={{color:'#15803d',margin:'1vmin 0'}}>예절 박사 수료증</p>
                        <p className="v-body" style={{color:'#6b7280',marginBottom:'2vmin'}}>우리 학교 사람들을 알아보고<br/>따뜻한 마음을 나누었어요!</p>
                        <div style={{background:'#f0fdf4',borderRadius:'2vmin',padding:'2vmin',border:'0.4vmin dashed #86efac',textAlign:'left',marginBottom:'2vmin'}}>
                            <p className="v-body" style={{fontWeight:700,color:'#374151'}}>이름: {studentName}</p>
                            <p className="v-body" style={{fontWeight:700,color:'#374151'}}>별점: {'⭐'.repeat(stars)}</p>
                        </div>
                        <button className="v-btn v-btn-green" onClick={()=>window.location.reload()}>처음으로 돌아가기 🏠</button>
                    </div>
                </div>
            );

            return null;

        };

        const Root = () => <App />;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>
</body>

</html>
